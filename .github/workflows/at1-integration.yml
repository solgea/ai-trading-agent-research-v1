name: AT-1 Agent Teams Frozen Core Integration
on:
  push:
    branches: [main, at1-agent-teams-frozen-core]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  at1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q tests/agent_contracts tests/core tests/at1
